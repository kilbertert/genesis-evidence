# ── the entry's log format ───────────────────────────────────────────────────
# `$uri`, never `$request` and never `$request_uri`. The mall's entry page sends
# the patient here as `/?ticket=…`, and that ticket **is** a credential. `$uri`
# records `/` and drops the query string, so the ticket is not written to disk
# where it would outlive its 120-second validity. Do not "improve" this line: if
# you need the query string for a debugging session, that is a temporary edit
# with a restart, not a change to what is kept.
#
# This is declared here rather than in the host's global configuration because it
# belongs to exactly one entry. `include`d files sit in the `http` context, which
# is the only place `log_format` may appear.
log_format portal escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"}';

# Patient portal — public entry (transition hostname `health.ranlei.work`).
#
# This file is the **only** public entry this project has. The review workbench
# and the evidence API are internal edges: their exposure was withdrawn on
# observed traffic (2026-09-28) and this file does not reinstate it.
#
# Deployed into the host's vhost directory. The name sorts after the existing
# `00-default-catchall.conf`, which holds `default_server` for 443; the ordering
# is not what makes an unknown Host safe (that block does), but keeping it after
# the catch-all means a reader looking for "which block answers 443 by default"
# finds the catch-all first, as the file order says.
#
# TLS terminates here. The service behind it binds loopback only, so this block
# is the single thing an application change does not have to touch.

# ── 80: ACME validation and a redirect, nothing else ─────────────────────────
# Certificate issuance needs this name to answer on port 80. Everything that is
# not a challenge is redirected rather than served — the portal carries report
# data and a session token, and neither may cross the network in the clear.
# Note that there is deliberately **no** `root` for the whole site: only the
# challenge prefix maps to a directory on disk.
server {
    listen 80;
    server_name health.ranlei.work;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/health.ranlei.work;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443: the entry ───────────────────────────────────────────────────────────
# No `listen [::]:443` and no `www.` name: DNS has a single A record and a single
# name, so those would be unverified configuration for a request that cannot
# arrive. Adding them later is a DNS decision first.
server {
    listen 443 ssl;
    http2 on;
    server_name health.ranlei.work;

    # Let's Encrypt, ECDSA. The certificate is **copied** here from
    # `/etc/letsencrypt/live/health.ranlei.work/` by this deployment's own
    # per-lineage deploy hook, because `/etc/letsencrypt/live` is `700 root` and
    # nginx's worker cannot read it — a detail that only looks unnecessary until
    # the master stops parsing configuration as root.
    ssl_certificate     /www/server/panel/vhost/cert/health.ranlei.work/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/health.ranlei.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS without `includeSubDomains` and without `preload`: this deployment
    # speaks for one hostname, and preload is a browser-vendor submission that is
    # effectively irreversible. Both would be decisions about names we do not
    # serve.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # This entry has its **own** access log. The host's global default is
    # `access_log off`, so a site that declares nothing is not recorded at all —
    # and then "how much external use does this entry get" is unanswerable, which
    # is exactly the question that decides whether it should keep existing.
    access_log /www/wwwlogs/health.ranlei.work.log portal;
    error_log  /www/wwwlogs/health.ranlei.work.error.log;

    # Two large report files in one submission.
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:10007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # **Overwrite**, not append. The application trusts proxy headers from a
        # loopback peer, and this request does come from a loopback peer, so it
        # will believe whatever is here. Appending (`$proxy_add_x_forwarded_for`)
        # would leave the client's own value at the head of the chain, and the
        # first person to add IP-based logic would read a forged address. Nothing
        # reads the client IP today; this is prevention, not a fix.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
