# genesis-evidence + health-flow — service host entry.
#
# Hand-written, following the precedent of the neighbouring internal entry in
# this directory. BT-Panel owns the directory but does not require every file in
# it to be panel-generated; nothing here modifies a panel-managed site.
#
# Both services bind loopback only, so this is their single public entry.
#
# TLS terminates here with the Cloudflare Origin certificate for *.ranlei.work,
# matching the existing entry path (Cloudflare -> origin). The public
# certificate a browser sees is Cloudflare's; this one only has to satisfy
# Cloudflare in Full (strict) mode.
#
# Plain HTTP redirects to HTTPS rather than serving: patient sessions and the
# reviewer's bearer key must not cross the network in the clear.

# This file sorts before the other configured sites, and nginx makes the first
# server block on a port the default for unmatched names. Without an explicit
# catch-all, an unknown host reaching 443 would land on our application — which
# is what happened before this block was added. The company's existing sites
# keep answering their own names; this only makes "no match" say so.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /www/server/panel/vhost/cert/genesis-evidence.ranlei.work/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/genesis-evidence.ranlei.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name genesis-evidence.ranlei.work genesis-evidence-review.ranlei.work;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name genesis-evidence.ranlei.work;

    ssl_certificate     /www/server/panel/vhost/cert/genesis-evidence.ranlei.work/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/genesis-evidence.ranlei.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Report uploads: two large report files in one submission.
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:10007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name genesis-evidence-review.ranlei.work;

    ssl_certificate     /www/server/panel/vhost/cert/genesis-evidence.ranlei.work/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/genesis-evidence.ranlei.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:10006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
