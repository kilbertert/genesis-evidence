# genesis-evidence + health-flow — service host entry.
#
# Hand-written, following the precedent of the neighbouring internal entry in
# this directory. BT-Panel owns the directory but does not require every file in
# it to be panel-generated; nothing here modifies a panel-managed site.
#
# Both services bind loopback only, so this is their single public entry.
# Uploads go through the report portal, hence the body size limit.

server {
    listen 80;
    listen [::]:80;
    server_name genesis-evidence.ranlei.work;

    # Report uploads: two large report files in one submission.
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:10007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name genesis-evidence-review.ranlei.work;

    location / {
        proxy_pass http://127.0.0.1:10006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
