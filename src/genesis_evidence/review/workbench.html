<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>论文证据审核工作台</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Noto Sans SC", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f5f0; color: #17231b; }
    header { padding: 20px 28px; background: #173f32; color: white; display: flex; gap: 20px; align-items: end; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; color: #cfe2d7; }
    .credentials { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { border: 1px solid #bec9c0; border-radius: 7px; padding: 8px 10px; background: white; }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #9ccbb8; outline-offset: 2px; }
    textarea { width: 100%; min-height: 82px; resize: vertical; }
    button { border: 0; border-radius: 7px; padding: 8px 12px; cursor: pointer; background: #24654e; color: white; }
    button:disabled { opacity: .62; cursor: wait; }
    button.secondary { background: #65736b; }
    button.danger { background: #9b3a32; }
    main { display: grid; grid-template-columns: minmax(250px, 330px) 1fr; min-height: calc(100vh - 92px); }
    aside { border-right: 1px solid #d5ddd6; padding: 18px; background: #fbfcfa; }
    #queue button { display: block; width: 100%; text-align: left; margin: 8px 0; background: white; color: #17231b; border: 1px solid #d5ddd6; }
    #queue button.active { border-color: #24654e; box-shadow: 0 0 0 2px #d7e8df; }
    #queue button.loading { border-color: #24654e; }
    .content { padding: 22px; overflow: auto; }
    .panel { background: white; border: 1px solid #d5ddd6; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .panel h2, .panel h3 { margin-top: 0; }
    .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
    .tag { display: inline-block; padding: 3px 7px; border-radius: 999px; background: #e6eee9; margin: 2px; font-size: 12px; }
    .warning { background: #fff4d8; border-color: #e8ca7a; }
    .blocked { background: #fff0ee; border-color: #ddb0aa; }
    .review-summary { display: flex; justify-content: space-between; gap: 12px; align-items: start; flex-wrap: wrap; }
    .checklist { list-style: none; padding: 0; margin: 14px 0 0; }
    .checklist li { display: grid; grid-template-columns: 90px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #e2e7e3; }
    .check-pass { color: #24654e; }
    .check-action { color: #7a5a00; }
    .check-blocked { color: #a4261d; }
    .step-label { color: #24654e; font-size: 13px; font-weight: 700; }
    details.claim > summary { cursor: pointer; font-weight: 700; }
    .ai-draft { white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f5f0; padding: 10px; }
    .claim { border-top: 1px solid #e2e7e3; padding-top: 14px; margin-top: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .coverage-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .coverage-table th, .coverage-table td { border-bottom: 1px solid #d5ddd6; padding: 8px 6px; text-align: left; vertical-align: top; }
    .coverage-table th { color: #65736b; font-weight: 600; white-space: nowrap; }
    .coverage-table .status { white-space: nowrap; font-weight: 600; }
    .muted { color: #65736b; font-size: 13px; }
    .error { color: #a4261d; }
    .loading-state { min-height: 120px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #65736b; }
    .spinner { width: 18px; height: 18px; border: 2px solid #cbd8d0; border-top-color: #24654e; border-radius: 50%; animation: spin .8s linear infinite; flex: 0 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-color: #24654e; } }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #d5ddd6; } }
  </style>
</head>
<body>
<header>
  <div><h1>论文证据审核工作台</h1><p>AI 自主执行 → 异常队列与人工抽查 → Evidence Profile → 正式知识卡</p></div>
  <div class="credentials">
    <label>审核密钥 <input id="key" type="password" autocomplete="off"></label>
    <span>认证审核人：<strong id="reviewer">未认证</strong></span>
    <button id="connect">连接</button>
  </div>
</header>
<main>
  <aside><div class="review-summary"><h2>论文队列</h2><button id="autoAll">AI 处理全部待办</button></div><div id="status" class="muted" role="status" aria-live="polite">请输入密钥。</div><div id="queue"></div><h2>抽取任务</h2><div id="jobs"></div></aside>
  <section class="content"><div id="coverage" class="panel"><h2>疾病框架覆盖矩阵</h2><p class="muted">正在加载覆盖状态…</p></div><div id="detail" class="panel" aria-live="polite"><p>选择一篇论文开始审核。</p></div><div id="cards" class="panel"><h2>知识卡</h2></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const designs = ['randomized_controlled_trial','systematic_review_meta_analysis','controlled_feeding_metabolic_study','bioavailability_pharmacokinetic_study','cohort_study','case_control_study','cross_sectional_study','biomarker_validation_study','non_randomized_controlled_study','natural_experiment','ecological_study','animal_study','in_vitro_study','case_series','case_report','guideline','other','uncertain'];
const robTools = ['rob2','robins_i','robis','amstar2','diagnostic_accuracy','exposure_study','safety_signal','other'];
const publicationRoles = ['primary','protocol','statistical_analysis_plan','follow_up','subgroup','combined_report','correction','retraction','other'];
const stageNames = {extraction_a:'AI-A 通读抽取',extraction_b:'AI-B 独立抽取（同一模型）',consistency:'独立抽取差异检查',saved:'结果已保存'};
const reviewStates = {blocked:'证据闸门阻塞',ready_for_automation:'等待 AI 执行',completed:'论文级审核完成'};
let conditions = [], topics = [], selectedPaper = null, current = null, refreshTimer = null, paperRequest = 0;

async function api(path, options = {}) {
  const response = await fetch(path, { ...options, headers: {'Content-Type':'application/json','Authorization':`Bearer ${$('key').value}`,...(options.headers || {})} });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
  return body;
}
function setStatus(message, error = false) { $('status').textContent = message; $('status').className = error ? 'error' : 'muted'; }
function setButtonBusy(button, busy, label = '处理中…') {
  if (!button) return;
  if (busy) { button.dataset.label = button.textContent; button.textContent = label; button.disabled = true; button.setAttribute('aria-busy','true'); }
  else { button.textContent = button.dataset.label || button.textContent; button.disabled = false; button.removeAttribute('aria-busy'); delete button.dataset.label; }
}
async function runAction(button, pending, success, action) {
  if (button?.disabled) return;
  setButtonBusy(button, true); setStatus(pending);
  try { const result = await action(); setStatus(typeof result === 'string' ? result : success); }
  catch (error) { setStatus(error.message || '操作失败', true); }
  finally { setButtonBusy(button, false); }
}
function options(values, selected = '') { return values.map(v => `<option value="${esc(v)}" ${v === selected ? 'selected' : ''}>${esc(v)}</option>`).join(''); }
function conditionOptions(selected = '') { return `<option value="">请选择健康问题</option>${conditions.map(c => `<option value="${esc(c.code)}" ${c.code === selected ? 'selected' : ''}>${esc(c.name)} · ${esc(c.code)}</option>`).join('')}`; }

async function loadAll(authenticate = false) {
  if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
  $('queue').setAttribute('aria-busy','true'); $('jobs').setAttribute('aria-busy','true'); $('cards').setAttribute('aria-busy','true');
  try {
    if (authenticate) {
      $('reviewer').textContent = '认证中…';
      try {
        const me = await api('/api/review/me');
        $('reviewer').textContent = me.reviewer_id;
        sessionStorage.setItem('reviewKey', $('key').value);
      } catch (error) {
        $('reviewer').textContent = '未认证'; sessionStorage.removeItem('reviewKey'); throw error;
      }
    }
    const [nextConditions, nextTopics, papers, jobs, cards, coverage] = await Promise.all([
      api('/api/review/conditions'), api('/api/review/topics'), api('/api/review/papers'),
      api('/api/review/extraction-jobs'), api('/api/review/cards'), api('/api/review/coverage-matrix')
    ]);
    conditions = nextConditions; topics = nextTopics;
    renderCoverage(coverage);
    $('queue').innerHTML = papers.map(p => `<button data-paper="${esc(p.id)}" class="${p.id === selectedPaper ? 'active' : ''}"><strong>${esc(p.title || '无标题')}</strong><br><span class="muted">${esc(reviewStates[p.review_state] || p.review_state)} · ${p.full_text_not_retrieved ? '全文未取得（台账已闭合）' : p.full_text_available ? esc(p.extraction_job_status || '未入队') : '全文缺失'} / ${esc(p.extraction_job_stage || '—')} · 待审 ${esc(p.pending_claims || 0)}</span></button>`).join('') || '<p class="muted">暂无论文。</p>';
    document.querySelectorAll('[data-paper]').forEach(button => button.onclick = () => openPaper(button.dataset.paper));
    $('jobs').innerHTML = jobs.map(j => `<div class="claim"><strong>${esc(j.title)}</strong><p class="muted">${esc(j.status)} · ${esc(j.stage)} · 尝试 ${esc(j.attempt_count)}</p>${j.error_message ? `<p class="error">${esc(j.error_class)}：${esc(j.error_message)}</p>` : ''}${j.status === 'failed' ? `<button data-retry-job="${esc(j.id)}">重试</button>` : ''}</div>`).join('') || '<p class="muted">暂无任务。</p>';
    document.querySelectorAll('[data-retry-job]').forEach(button => button.onclick = () => runAction(button, '正在重新提交抽取任务…', '抽取任务已重新入队。', async () => { await api(`/api/review/extraction-jobs/${button.dataset.retryJob}/retry`,{method:'POST'}); await loadAll(); }));
    renderCards(cards);
    if (jobs.some(j => j.status === 'queued' || j.status === 'running')) {
      refreshTimer = setTimeout(() => loadAll().catch(error => setStatus(error.message, true)), 5000);
    }
    return papers.length;
  } finally {
    $('queue').removeAttribute('aria-busy'); $('jobs').removeAttribute('aria-busy'); $('cards').removeAttribute('aria-busy');
  }
}

async function openPaper(id, announce = true) {
  const request = ++paperRequest;
  selectedPaper = id;
  document.querySelectorAll('[data-paper]').forEach(button => button.classList.toggle('active', button.dataset.paper === id));
  const button = document.querySelector(`[data-paper="${CSS.escape(id)}"]`);
  button?.classList.add('loading'); button?.setAttribute('aria-busy','true');
  $('detail').setAttribute('aria-busy','true');
  $('detail').innerHTML = '<div class="loading-state"><span class="spinner" aria-hidden="true"></span><span>正在加载论文详情…</span></div>';
  if (window.matchMedia('(max-width: 800px)').matches) requestAnimationFrame(() => window.scrollTo(0, $('detail').getBoundingClientRect().top + window.scrollY - 12));
  if (announce) setStatus('正在加载论文详情…');
  try {
    const item = await api(`/api/review/papers/${id}`);
    if (request !== paperRequest) return;
    current = item; renderPaper();
    if (announce) setStatus('论文详情已加载。');
  } catch (error) {
    if (request !== paperRequest) return;
    $('detail').innerHTML = `<p class="error">${esc(error.message || '论文详情加载失败。')}</p>`;
    setStatus(error.message || '论文详情加载失败。', true);
  } finally {
    button?.classList.remove('loading'); button?.removeAttribute('aria-busy');
    if (request === paperRequest) $('detail').removeAttribute('aria-busy');
  }
}

function renderPaper() {
  const p = current.paper, extraction = current.extraction || {}, secondExtraction = current.second_extraction || {}, consistency = current.consistency || {verdict:'missing',issues:[]}, guidance = current.review_guidance || {checks:[],issues:[],admission_suggestion:{}};
  const job = current.extraction_job || {};
  const suggested = guidance.admission_suggestion || {};
  const admitted = new Set(current.admission?.condition_codes || suggested.condition_codes || []);
  const conditionChecks = conditions.map(c => `<label><input type="checkbox" name="admit-condition" value="${esc(c.code)}" ${admitted.has(c.code) ? 'checked' : ''}> ${esc(c.name)}</label>`).join('<br>');
  const mustResolve = (guidance.issues || []).filter(i => i.priority === 'must_resolve');
  const verifyIssues = (guidance.issues || []).filter(i => i.priority !== 'must_resolve');
  const issueList = values => values.map(i => `<li><strong>${esc(i.severity)} · ${esc(i.field)}</strong>：${esc(i.message)}<br><span class="muted">原文线索：${esc(i.evidence || '未提供')}</span></li>`).join('');
  const resolution = consistency.verdict === 'needs_review' ? `<details><summary>AI 自动裁决方案与人工接管</summary><pre class="ai-draft">${esc(current.admission?.consistency_resolution || suggested.consistency_resolution || 'AI 将保留每项差异、原文线索和采用策略。')}</pre><label>人工覆盖裁决<textarea id="consistencyResolution" placeholder="仅在需要人工修正时填写。">${esc(current.admission?.consistency_resolution || '')}</textarea></label><label><input id="differencesConfirmed" type="checkbox" ${current.admission?.consistency_resolution ? 'checked' : ''}> 人工接管并覆盖 AI 裁决</label></details>` : '';
  const screening = (current.collections || []).map(c => {
    const ai = c.screening_suggestion || {};
    const stage = ai.stage || (c.title_abstract_decision === 'included' ? 'full_text' : 'title_abstract');
    const decision = ai.stage ? ai.decision : (c.full_text_decision || c.title_abstract_decision || '');
    const reason = ai.primary_exclusion_reason || c.primary_exclusion_reason || '';
    return `<div class="claim" data-screen-run="${esc(c.run_id)}" data-screen-topic="${esc(c.topic_id)}"><strong>${esc(c.topic_code)} · ${esc(c.topic_version)} · ${esc(c.search_stream)}</strong><div class="grid"><label>全文获取<select name="retrieval-status">${options(['pending','retrieved','not_retrieved'], c.full_text_retrieval_status || 'pending')}</select></label><label>未取得原因<input name="retrieval-reason" value="${esc(c.full_text_retrieval_reason || '')}" placeholder="例如：许可限制、接口未提供全文"></label></div><button data-record-retrieval>保存全文获取结果</button><p><span class="tag">AI 决策：${esc(ai.decision || (ai.stage ? '需要异常处理' : '已完成'))}</span> ${esc(ai.reason || '当前筛选记录已保存。')}</p><div class="grid"><label>筛选阶段<select name="screen-stage">${options(['title_abstract','full_text'], stage)}</select></label><label>决定<select name="screen-decision"><option value="">请选择</option>${options(['included','excluded'], decision)}</select></label><label>唯一主要排除原因<select name="screen-reason"><option value="">不适用</option>${options(c.exclusion_reasons || [], reason)}</select></label></div><p class="muted">题录：${esc(c.title_abstract_decision || '待筛选')} · 全文获取：${esc(c.full_text_retrieval_status || 'pending')} · 全文筛选：${esc(c.full_text_decision || '待筛选')}</p>${ai.stage ? '<button data-screen-paper>人工覆盖筛选决定</button>' : ''}</div>`;
  }).join('') || '<p class="muted">此论文尚未关联版本化主题采集运行。</p>';
  if (!current.extraction) {
    const notRetrieved = guidance.terminal_decision === 'not_retrieved';
    const failed = job.status === 'failed';
    const state = notRetrieved ? '全文未取得（台账已闭合）' : !job.full_text_available ? '全文缺失' : failed ? '抽取失败' : job.status === 'running' ? '正在处理' : job.status === 'queued' ? '等待处理' : '尚未进入抽取队列';
    const detail = notRetrieved ? `<p>${esc(guidance.next_action)}</p>` : !job.full_text_available ? '<p>该论文没有已保存的全文对象，无法开始独立抽取。</p>' : failed ? `<p class="error">${esc(job.error_class)}：${esc(job.error_message)}</p><button id="retryCurrent">重试失败阶段</button>` : `<p>当前阶段：${esc(stageNames[job.stage] || job.stage || '—')}。任务完成后才会显示通读摘要、独立抽取和差异检查。</p>`;
    $('detail').innerHTML = `<div class="panel"><h2>${esc(p.title)}</h2><div class="meta"><div>DOI：${esc(p.doi || '—')}</div><div>年份：${esc(p.year || '—')}</div><div>完整性：<span class="tag">${esc(p.integrity_status)}</span></div><div>抽取：<span class="tag">${esc(state)}</span></div></div><h3>${esc(state)}</h3>${detail}</div><div class="panel"><h2>主题筛选台账</h2>${screening}</div>`;
    if (failed) $('retryCurrent').onclick = event => runAction(event.currentTarget, '正在重新提交抽取任务…', '抽取任务已重新入队。', async () => { await api(`/api/review/extraction-jobs/${job.id}/retry`,{method:'POST'}); await refreshCurrent(); });
    document.querySelectorAll('[data-screen-paper]').forEach(button => button.onclick = () => screenPaper(button.closest('[data-screen-run]'), button));
    document.querySelectorAll('[data-record-retrieval]').forEach(button => button.onclick = () => recordRetrieval(button.closest('[data-screen-run]'), button));
    return;
  }
  const checkItems = (guidance.checks || []).map(check => `<li><strong class="check-${esc(check.status)}">${check.status === 'pass' ? '已通过' : check.status === 'action' ? 'AI 待执行' : check.status === 'not_applicable' ? '不适用' : '阻塞'}</strong><div><b>${esc(check.label)}</b><br><span class="muted">${esc(check.detail)}</span></div></li>`).join('');
  const study = current.studies?.[0] || {};
  const sources = (current.sources || []).map(source => `${esc(source.source)} · ${esc(source.source_id)}`).join('；') || '无来源记录';
  const admittedPaper = current.admission?.status === 'internally_admitted';
  const canHumanAdmit = (guidance.checks || []).every(check => check.status === 'pass' || (check.id === 'dual_ai' && check.status === 'blocked'));
  const allClaimsReviewed = admittedPaper && (current.claims || []).length > 0 && (current.claims || []).every(claim => claim.status !== 'candidate');
  const conditionFacts = (extraction.condition_candidates || []).map(item => `<li><strong>${esc(item.condition_code)}</strong>：${esc(item.rationale)}<br><span class="muted">${esc(item.evidence)} · ${esc(item.locator)}</span></li>`).join('') || '<li>未识别到首批健康问题。</li>';
  const symptomFacts = (extraction.directly_reported_symptoms || []).map(item => `${esc(item.name)}（${esc(item.locator)}）`).join('；') || '论文未直接报告症状';
  const factsPanel = `<div class="panel"><h2>AI-A 论文事实摘要</h2><div class="grid"><div><h3>研究的方法或营养措施</h3><p>${(extraction.studied_approach || []).map(esc).join('；') || '未报告'}</p></div><div><h3>研究结局</h3><p>${(extraction.outcomes || []).map(esc).join('；') || '未报告'}</p></div></div><h3>可能相关的健康问题及原文依据</h3><ul>${conditionFacts}</ul><h3>论文直接报告的症状</h3><p>${symptomFacts}</p></div>`;
  const claims = (current.claims || []).map((c, index) => {
    const ai = c.review_suggestion || {}, risk = c.risk_of_bias || ai.risk_of_bias || {};
    const disabled = admittedPaper ? '' : 'disabled';
    return `<details class="claim" data-claim="${esc(c.id)}" ${index === 0 ? 'open' : ''}><summary>Result / Claim ${index + 1} <span class="tag">${esc(c.status)}</span> <span class="tag">AI 可自动执行</span></summary><p>${esc(c.candidate_text)}</p><p class="muted">原文：${esc(c.evidence_text)} · ${esc(c.locator)}</p><div class="meta"><div>人群：${esc(c.population)}</div><div>基线营养状态：${esc(c.baseline_nutrient_status)}</div><div>成分/形式：${esc(c.ingredient_name)} / ${esc(c.ingredient_form)}</div><div>剂量：${esc(c.dose)}</div><div>对照：${esc(c.comparator)}</div><div>结局/时间点：${esc(c.outcome)} / ${esc(c.timepoint)}</div><div>效应估计：${esc(c.effect_estimate)}</div><div>统计信息：${esc(c.statistical_details)}</div></div><p class="muted">核验项：${(ai.human_checks || []).map(esc).join('；')}</p><label>校正后的 Claim<textarea name="corrected">${esc(c.corrected_text || ai.corrected_text || c.candidate_text)}</textarea></label><div class="grid"><label>研究设计<select name="design">${options(designs, c.corrected_study_design || ai.corrected_study_design || c.candidate_study_design || 'uncertain')}</select></label><label>推断<select name="inference">${options(['associational','descriptive','causal'], c.inference || ai.inference || 'descriptive')}</select></label><label>偏倚工具<select name="rob-tool">${options(robTools, risk.tool || 'other')}</select></label><label>总体偏倚<select name="rob-overall">${options(['low','some_concerns','high','critical','uncertain'], risk.overall || 'uncertain')}</select></label><label>健康问题<select name="condition">${conditionOptions(c.condition_code || ai.condition_code || '')}</select></label></div><label>偏倚依据<textarea name="rob-rationale">${esc(risk.rationale || '')}</textarea></label><label>适用性<textarea name="applicability">${esc(c.applicability || ai.applicability || '')}</textarea></label><label><input type="checkbox" name="source-verified" ${c.decision === 'approved' ? 'checked' : ''}> 人工接管时确认已对照原文核验</label><div class="actions"><label><input type="checkbox" name="card-claim" value="${esc(c.id)}" ${c.decision === 'approved' ? 'checked' : ''}> 纳入 Evidence Profile</label><label>证据体解释<select name="profile-interpretation">${options(['supports','does_not_support','mixed','uncertain','not_reported'],'uncertain')}</select></label><button data-approve="${esc(c.id)}" ${disabled}>人工覆盖并批准</button><button class="danger" data-reject-claim="${esc(c.id)}" ${disabled}>人工拒绝</button></div></details>`;
  }).join('') || '<p class="muted">暂无候选 Result / Claim。</p>';
  const topicOptions = topics.filter(t => t.status === 'locked').map(t => `<option value="${esc(t.id)}">${esc(t.code)} · ${esc(t.version)}</option>`).join('');
  const jobStatus = `<div>抽取：<span class="tag">${esc(job.status || '未入队')} · ${esc(job.stage || '—')}</span></div>`;
  const audit = (current.audit_events || []).map(event => `<li><strong>${esc(event.action)}</strong> · ${esc(event.actor)} · ${esc(event.created_at)}<details><summary>查看审计数据</summary><pre class="ai-draft">${esc(JSON.stringify(event.detail,null,2))}</pre></details></li>`).join('') || '<li>暂无审计事件。</li>';
  $('detail').innerHTML = `
    <div class="panel ${guidance.state === 'blocked' ? 'blocked' : guidance.state === 'ready_for_automation' ? 'warning' : ''}">
      <div class="review-summary"><div><span class="step-label">AI 正式执行</span><h2>${esc(reviewStates[guidance.state] || guidance.state)}</h2><p>${esc(guidance.next_action || '')}</p></div><div class="actions"><span class="tag">${(guidance.issues || []).length} 项差异</span><button id="autoCurrent">AI 自动完成当前论文</button></div></div><ul class="checklist">${checkItems}</ul>
    </div>
    <div class="panel"><h2>${esc(p.title)}</h2><div class="meta"><div>DOI：${esc(p.doi || '—')}</div><div>年份：${esc(p.year || '—')}</div><div>完整性：<span class="tag">${esc(p.integrity_status)}</span></div><div>准入：<span class="tag">${esc(current.admission?.status || 'pending')}</span></div></div><h3>AI-A 通读摘要</h3><p>${esc(extraction.summary || '暂无')}</p><p><strong>研究问题：</strong>${esc(extraction.research_question || '暂无')}</p><p><strong>研究设计候选：</strong>${esc(extraction.study_design || p.study_design_candidate || 'uncertain')}</p><details><summary>查看 AI-B 独立抽取</summary><pre>${esc(JSON.stringify(secondExtraction,null,2))}</pre></details></div>
    <div class="panel"><span class="step-label">步骤 1 · AI 执行 / 人工可覆盖</span><h2>版本化主题 / PICOTS 筛选</h2>${screening}</div>
    <div class="panel ${consistency.verdict === 'consistent' ? '' : 'warning'}"><span class="step-label">步骤 2 · AI 执行 / 人工可覆盖</span><h2>两次独立同模型抽取差异裁决</h2>${mustResolve.length ? `<h3>必须裁决 ${mustResolve.length} 项</h3><ul>${issueList(mustResolve)}</ul>` : '<p>没有关键冲突。</p>'}${verifyIssues.length ? `<details><summary>另外核对 ${verifyIssues.length} 项非关键差异</summary><ul>${issueList(verifyIssues)}</ul></details>` : ''}${resolution}</div>
    <div class="panel"><span class="step-label">步骤 3 · AI 执行 / 人工可接管</span><h2>研究身份确认与论文准入</h2><p class="muted">来源：${sources}<br>Study：${esc(study.id || '缺失')} · ${esc(study.status || '未知')} · 注册号 ${esc((study.registration_ids || []).join('、') || '未报告')}</p><details><summary>人工接管身份与准入决定</summary><div class="grid"><label>研究设计<select id="admitStudyDesign">${options(designs, suggested.study_design || extraction.study_design || 'uncertain')}</select></label><label>Publication 角色<select id="publicationRole">${options(publicationRoles, suggested.publication_role || 'primary')}</select></label></div><h3>关联健康问题</h3>${conditionChecks}<label><input id="identityConfirmed" type="checkbox" ${admittedPaper ? 'checked' : ''}> 已核对论文身份、研究设计、注册/协议及版本关系</label><div class="actions"><button id="admit" ${!canHumanAdmit || admittedPaper ? 'disabled' : ''}>人工覆盖并准入</button><button id="rejectPaper" class="danger">人工拒绝论文</button></div></details></div>
    <div class="panel"><span class="step-label">步骤 4 · AI 执行 / 人工可接管</span><h2>Result 与 Claim 审核</h2>${admittedPaper ? '' : '<p class="warning">AI 会先完成论文准入，再逐条审核 Claim。</p>'}${claims}</div>
    <div class="panel"><span class="step-label">步骤 5 · AI 执行 / 证据规则闸门</span><h2>Evidence Profile 与知识卡</h2><p class="muted">AI 会在主题证据体完整时按相同 PICOTS 结果范围建档，并显式记录 GRADE 域。低或极低确定性内容不会发布到患者端。</p><details><summary>人工接管知识卡草稿</summary>${allClaimsReviewed ? '' : '<p class="warning">本论文仍有候选 Claim 未处理。</p>'}<div class="grid"><label>版本化主题<select id="cardTopic">${topicOptions}</select></label><label>健康问题<select id="cardCondition">${conditionOptions()}</select></label><label>版本<input id="cardVersion" value="1.0.0"></label><label>证据确定性<select id="profileCertainty">${options(['high','moderate','low','very_low'],'moderate')}</select></label></div><label>估计目标<textarea id="profileTarget"></textarea></label><label>确定性理由<textarea id="profileRationale"></textarea></label><label>患者可见正文<textarea id="cardBody"></textarea></label><button id="createCard" ${allClaimsReviewed ? '' : 'disabled'}>人工创建草稿</button></details></div>
    <div class="panel"><span class="step-label">可审计记录</span><h2>状态转换与执行依据</h2><ol>${audit}</ol></div>`;
  $('detail').firstElementChild.insertAdjacentHTML('afterend', factsPanel);
  $('detail').querySelector('.meta').insertAdjacentHTML('beforeend', jobStatus);
  $('autoCurrent').onclick = event => autoReviewCurrent(event.currentTarget); $('admit').onclick = event => admitPaper(event.currentTarget); $('rejectPaper').onclick = event => rejectPaper(event.currentTarget); $('createCard').onclick = event => createCard(event.currentTarget);
  document.querySelectorAll('[data-approve]').forEach(button => button.onclick = () => reviewClaim(button.dataset.approve, 'approved', button));
  document.querySelectorAll('[data-reject-claim]').forEach(button => button.onclick = () => reviewClaim(button.dataset.rejectClaim, 'rejected', button));
  document.querySelectorAll('[data-screen-paper]').forEach(button => button.onclick = () => screenPaper(button.closest('[data-screen-run]'), button));
  document.querySelectorAll('[data-record-retrieval]').forEach(button => button.onclick = () => recordRetrieval(button.closest('[data-screen-run]'), button));
}

async function refreshCurrent() { const id = selectedPaper; await loadAll(); if (id && id === selectedPaper) await openPaper(id, false); }
function autoReviewCurrent(button) { return runAction(button, 'AI 正在执行筛选、裁决、准入、Claim 与证据档案…', 'AI 执行已完成。', async () => { const result = await api(`/api/review/papers/${selectedPaper}/auto-review`, {method:'POST'}); await refreshCurrent(); return result.status === 'attention_required' ? `AI 已停在 ${result.stage}：${result.reason}` : result.status === 'queued' || result.status === 'running' ? `全文抽取任务状态：${result.status}，完成后可继续自动审核。` : 'AI 执行已完成；证据限制和结果已写入审计记录。'; }); }
function autoReviewAll(button) { return runAction(button, 'AI 正在处理全部论文待办…', '全部论文已处理。', async () => { const result = await api('/api/review/papers/auto-review', {method:'POST'}); await loadAll(); if (selectedPaper) await openPaper(selectedPaper, false); return `已处理 ${result.processed} 篇；${result.pending_extraction} 篇等待抽取，${result.attention_required} 篇进入异常队列。`; }); }
function admitPaper(button) { const condition_codes = [...document.querySelectorAll('[name="admit-condition"]:checked')].map(x => x.value); return runAction(button, '正在保存具名论文准入决定…', '论文已完成具名准入。', async () => { await api(`/api/review/papers/${selectedPaper}/admit`, {method:'POST',body:JSON.stringify({condition_codes,consistency_resolution:$('consistencyResolution')?.value || null,differences_confirmed:$('differencesConfirmed')?.checked || false,study_design:$('admitStudyDesign').value,publication_role:$('publicationRole').value,identity_confirmed:$('identityConfirmed').checked})}); await refreshCurrent(); }); }
function rejectPaper(button) { return runAction(button, '正在拒绝论文…', '论文已拒绝。', async () => { await api(`/api/review/papers/${selectedPaper}/reject`, {method:'POST'}); await refreshCurrent(); }); }
function reviewClaim(id, decision, button) { const root = document.querySelector(`[data-claim="${CSS.escape(id)}"]`); const payload = {decision}; if (decision === 'approved') Object.assign(payload,{corrected_text:root.querySelector('[name="corrected"]').value,corrected_study_design:root.querySelector('[name="design"]').value,inference:root.querySelector('[name="inference"]').value,risk_of_bias:{tool:root.querySelector('[name="rob-tool"]').value,overall:root.querySelector('[name="rob-overall"]').value,rationale:root.querySelector('[name="rob-rationale"]').value},applicability:root.querySelector('[name="applicability"]').value,condition_code:root.querySelector('[name="condition"]').value,source_verified:root.querySelector('[name="source-verified"]').checked}); return runAction(button, '正在保存具名 Result / Claim 审核…', 'Result / Claim 具名审核已保存。', async () => { await api(`/api/review/claims/${id}`,{method:'POST',body:JSON.stringify(payload)}); await refreshCurrent(); }); }
function screenPaper(root, button) { return runAction(button, '正在保存筛选决定…', '筛选决定已保存。', async () => { await api(`/api/review/topics/${root.dataset.screenTopic}/runs/${root.dataset.screenRun}/papers/${selectedPaper}/screen`,{method:'POST',body:JSON.stringify({stage:root.querySelector('[name="screen-stage"]').value,decision:root.querySelector('[name="screen-decision"]').value,primary_exclusion_reason:root.querySelector('[name="screen-reason"]').value || null})}); await refreshCurrent(); }); }
function recordRetrieval(root, button) { return runAction(button, '正在保存全文获取结果…', '全文获取结果已保存。', async () => { await api(`/api/review/topics/${root.dataset.screenTopic}/runs/${root.dataset.screenRun}/papers/${selectedPaper}/full-text-retrieval`,{method:'POST',body:JSON.stringify({status:root.querySelector('[name="retrieval-status"]').value,reason:root.querySelector('[name="retrieval-reason"]').value || null})}); await refreshCurrent(); }); }
function createCard(button) { const checked = [...document.querySelectorAll('[name="card-claim"]:checked')]; const claim_ids = checked.map(x => x.value); const interpretations = Object.fromEntries(checked.map(x => [x.value,x.closest('[data-claim]').querySelector('[name="profile-interpretation"]').value])); return runAction(button, '正在创建知识卡草稿…', '知识卡草稿已创建。', async () => { await api('/api/review/cards',{method:'POST',body:JSON.stringify({topic_id:$('cardTopic').value,condition_code:$('cardCondition').value,version:$('cardVersion').value,claim_ids,patient_body:$('cardBody').value,profile:{certainty:$('profileCertainty').value,certainty_rationale:$('profileRationale').value,estimate_target:$('profileTarget').value,interpretations}})}); await loadAll(); }); }

function renderCards(cards) { $('cards').innerHTML = `<h2>知识卡</h2>${cards.map(c => `<div class="claim"><strong>${esc(c.condition_code)} · ${esc(c.version)}</strong> <span class="tag">${esc(c.status)}</span><span class="tag">确定性 ${esc(c.grade)}</span><p>${esc(c.patient_visible_body)}</p><p class="muted">Evidence Profile：${esc(c.evidence_profile_id || '—')}<br>Claim：${(c.claim_ids || []).map(esc).join('、') || '—'}<br>论文：${(c.paper_ids || []).map(esc).join('、') || '—'}</p><div class="actions">${nextActions(c).map(a => `<button data-card="${esc(c.id)}" data-target="${esc(a)}">${esc(a)}</button>`).join('')}</div></div>`).join('') || '<p class="muted">暂无知识卡。</p>'}`; document.querySelectorAll('[data-card]').forEach(button => button.onclick = () => runAction(button, '正在更新知识卡状态…', '知识卡状态已更新。', async () => { await api(`/api/review/cards/${button.dataset.card}/transition`,{method:'POST',body:JSON.stringify({target:button.dataset.target})}); await loadAll(); })); }
function renderCoverage(rows) {
  const statusNames = {published:'已发布',ready_to_publish:'待发布',blocked_low_certainty:'低确定性阻塞',profile_ready:'Profile 已形成',claims_ready:'Claim 已审核',full_text_ready:'全文已纳入',screening:'筛选中',no_eligible_evidence:'暂无合格证据',topic_locked:'主题已锁定',planned:'待建主题'};
  const covered = rows.filter(row => row.coverage_status === 'published').length;
  $('coverage').innerHTML = `<div class="review-summary"><div><h2>疾病框架覆盖矩阵</h2><p class="muted">${covered} / ${rows.length} 个指标范围已发布患者可见知识卡。</p></div></div><div class="table-wrap"><table class="coverage-table"><thead><tr><th>健康问题</th><th>指标范围</th><th>证据进度</th><th>状态</th><th>下一步</th></tr></thead><tbody>${rows.map(row => `<tr><td><strong>${esc(row.condition_name)}</strong><br><span class="muted">${esc(row.condition_code)}</span></td><td>${esc(row.metric_label || '症状/问题级')}<br><span class="muted">${esc(row.metric_code || row.scope_key)}</span></td><td>主题 ${esc(row.locked_topic_count)} · 全文 ${esc(row.full_text_included_count)} · Claim ${esc(row.approved_claim_count)} · Profile ${esc(row.evidence_profile_count)}</td><td class="status">${esc(statusNames[row.coverage_status] || row.coverage_status)}${row.published_card ? `<br><span class="muted">v${esc(row.published_card.version)} · ${esc(row.published_card.grade)}</span>` : ''}</td><td>${esc(row.next_action)}</td></tr>`).join('')}</tbody></table></div>`;
}
function nextActions(card) { return ({draft:['in_review','rejected'],in_review:['approved','rejected'],approved:['published','rejected']}[card.status] || []); }

$('key').value = sessionStorage.getItem('reviewKey') || '';
$('connect').onclick = event => runAction(event.currentTarget, '正在验证密钥并加载工作台…', '工作台已连接。', () => loadAll(true));
$('autoAll').onclick = event => autoReviewAll(event.currentTarget);
$('key').onkeydown = event => { if (event.key === 'Enter') $('connect').click(); };
window.addEventListener('unhandledrejection', event => setStatus(event.reason?.message || '操作失败', true));
</script>
</body>
</html>
