<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>论文证据审核工作台</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Noto Sans SC", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f5f0; color: #17231b; }
    header { padding: 20px 28px; background: #173f32; color: white; display: flex; gap: 20px; align-items: end; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; color: #cfe2d7; }
    .credentials { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { border: 1px solid #bec9c0; border-radius: 7px; padding: 8px 10px; background: white; }
    textarea { width: 100%; min-height: 82px; resize: vertical; }
    button { border: 0; border-radius: 7px; padding: 8px 12px; cursor: pointer; background: #24654e; color: white; }
    button.secondary { background: #65736b; }
    button.danger { background: #9b3a32; }
    main { display: grid; grid-template-columns: minmax(250px, 330px) 1fr; min-height: calc(100vh - 92px); }
    aside { border-right: 1px solid #d5ddd6; padding: 18px; background: #fbfcfa; }
    #queue button { display: block; width: 100%; text-align: left; margin: 8px 0; background: white; color: #17231b; border: 1px solid #d5ddd6; }
    #queue button.active { border-color: #24654e; box-shadow: 0 0 0 2px #d7e8df; }
    .content { padding: 22px; overflow: auto; }
    .panel { background: white; border: 1px solid #d5ddd6; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .panel h2, .panel h3 { margin-top: 0; }
    .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
    .tag { display: inline-block; padding: 3px 7px; border-radius: 999px; background: #e6eee9; margin: 2px; font-size: 12px; }
    .warning { background: #fff4d8; border-color: #e8ca7a; }
    .claim { border-top: 1px solid #e2e7e3; padding-top: 14px; margin-top: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .muted { color: #65736b; font-size: 13px; }
    .error { color: #a4261d; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #d5ddd6; } }
  </style>
</head>
<body>
<header>
  <div><h1>论文证据审核工作台</h1><p>AI 候选 → 一人审核 → internally_admitted → Claim → 正式知识卡</p></div>
  <div class="credentials">
    <label>审核密钥 <input id="key" type="password" autocomplete="off"></label>
    <label>审核人 <input id="reviewer" autocomplete="name" placeholder="reviewer-1"></label>
    <button id="connect">连接</button>
  </div>
</header>
<main>
  <aside><h2>论文队列</h2><div id="status" class="muted">请输入密钥。</div><div id="queue"></div></aside>
  <section class="content"><div id="detail" class="panel"><p>选择一篇论文开始审核。</p></div><div id="cards" class="panel"><h2>知识卡</h2></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const designs = ['randomized_controlled_trial','systematic_review_meta_analysis','cohort_study','case_control_study','cross_sectional_study','case_series','case_report','guideline','other','uncertain'];
let conditions = [], selectedPaper = null, current = null;

async function api(path, options = {}) {
  const response = await fetch(path, { ...options, headers: {'Content-Type':'application/json','X-Review-Key':$('key').value,...(options.headers || {})} });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
  return body;
}
function reviewer() { const value = $('reviewer').value.trim(); if (!value) throw new Error('请填写审核人。'); return value; }
function setStatus(message, error = false) { $('status').textContent = message; $('status').className = error ? 'error' : 'muted'; }
function options(values, selected = '') { return values.map(v => `<option value="${esc(v)}" ${v === selected ? 'selected' : ''}>${esc(v)}</option>`).join(''); }
function conditionOptions(selected = '') { return conditions.map(c => `<option value="${esc(c.code)}" ${c.code === selected ? 'selected' : ''}>${esc(c.name)} · ${esc(c.code)}</option>`).join(''); }

async function loadAll() {
  sessionStorage.setItem('reviewKey', $('key').value);
  conditions = await api('/api/review/conditions');
  const papers = await api('/api/review/papers');
  $('queue').innerHTML = papers.map(p => `<button data-paper="${esc(p.id)}" class="${p.id === selectedPaper ? 'active' : ''}"><strong>${esc(p.title || '无标题')}</strong><br><span class="muted">${esc(p.integrity_status)} · ${esc(p.admission_status)} · 待审 ${esc(p.pending_claims || 0)}</span></button>`).join('') || '<p class="muted">暂无论文。</p>';
  document.querySelectorAll('[data-paper]').forEach(button => button.onclick = () => openPaper(button.dataset.paper));
  await loadCards();
  setStatus(`已加载 ${papers.length} 篇论文。`);
}

async function openPaper(id) {
  selectedPaper = id; current = await api(`/api/review/papers/${id}`); renderPaper();
  document.querySelectorAll('[data-paper]').forEach(button => button.classList.toggle('active', button.dataset.paper === id));
}

function renderPaper() {
  const p = current.paper, extraction = current.extraction || {}, consistency = current.consistency || {verdict:'missing',issues:[]};
  const admitted = new Set(current.admission?.condition_codes || []);
  const conditionChecks = conditions.map(c => `<label><input type="checkbox" name="admit-condition" value="${esc(c.code)}" ${admitted.has(c.code) ? 'checked' : ''}> ${esc(c.name)}</label>`).join('<br>');
  const issues = (consistency.issues || []).map(i => `<li><strong>${esc(i.severity)}</strong> ${esc(i.field)}：${esc(i.message)}<br><span class="muted">${esc(i.evidence)}</span></li>`).join('');
  const claims = (current.claims || []).map((c, index) => `<div class="claim" data-claim="${esc(c.id)}"><h3>Claim ${index + 1} <span class="tag">${esc(c.status)}</span></h3><p>${esc(c.candidate_text)}</p><p class="muted">证据：${esc(c.evidence_text)} · ${esc(c.locator)}</p><textarea name="corrected">${esc(c.corrected_text || c.candidate_text)}</textarea><div class="grid"><label>研究设计<select name="design">${options(designs, c.corrected_study_design || c.candidate_study_design || 'uncertain')}</select></label><label>推断<select name="inference">${options(['associational','descriptive','causal'], c.inference || 'associational')}</select></label><label>GRADE<select name="grade">${options(['high','moderate','low','very_low'], c.grade || 'low')}</select></label><label>健康问题<select name="condition">${conditionOptions(c.condition_code || '')}</select></label></div><div class="actions"><label><input type="checkbox" name="card-claim" value="${esc(c.id)}" ${c.decision === 'approved' ? 'checked' : ''}> 用于知识卡</label><button data-approve="${esc(c.id)}">批准 Claim</button><button class="danger" data-reject-claim="${esc(c.id)}">拒绝 Claim</button></div></div>`).join('') || '<p class="muted">暂无候选 Claim。</p>';
  $('detail').innerHTML = `<div class="panel"><h2>${esc(p.title)}</h2><div class="meta"><div>DOI：${esc(p.doi || '—')}</div><div>年份：${esc(p.year || '—')}</div><div>完整性：<span class="tag">${esc(p.integrity_status)}</span></div><div>准入：<span class="tag">${esc(current.admission?.status || 'pending')}</span></div></div><h3>AI 通读摘要</h3><p>${esc(extraction.summary || '暂无')}</p><p><strong>研究问题：</strong>${esc(extraction.research_question || '暂无')}</p><p><strong>研究设计候选：</strong>${esc(extraction.study_design || p.study_design_candidate || 'uncertain')}</p></div><div class="panel ${consistency.verdict === 'consistent' ? '' : 'warning'}"><h3>AI 一致性检查：${esc(consistency.verdict)}</h3>${issues ? `<ul>${issues}</ul>` : '<p>未报告冲突。</p>'}</div><div class="panel"><h3>论文内部准入</h3>${conditionChecks}<div class="actions"><button id="admit">internally_admitted</button><button id="rejectPaper" class="danger">拒绝论文</button></div></div><div class="panel"><h2>Claim 审核</h2>${claims}</div><div class="panel"><h2>形成知识卡草稿</h2><div class="grid"><label>健康问题<select id="cardCondition">${conditionOptions()}</select></label><label>版本<input id="cardVersion" value="1.0.0"></label></div><label>患者可见正文<textarea id="cardBody" placeholder="只写经审核的营养相关知识，不写诊断或处方。"></textarea></label><button id="createCard">创建草稿</button></div>`;
  $('admit').onclick = admitPaper; $('rejectPaper').onclick = rejectPaper; $('createCard').onclick = createCard;
  document.querySelectorAll('[data-approve]').forEach(button => button.onclick = () => reviewClaim(button.dataset.approve, 'approved'));
  document.querySelectorAll('[data-reject-claim]').forEach(button => button.onclick = () => reviewClaim(button.dataset.rejectClaim, 'rejected'));
}

async function admitPaper() { const condition_codes = [...document.querySelectorAll('[name="admit-condition"]:checked')].map(x => x.value); await api(`/api/review/papers/${selectedPaper}/admit`, {method:'POST',body:JSON.stringify({reviewer:reviewer(),condition_codes})}); await openPaper(selectedPaper); await loadAll(); }
async function rejectPaper() { await api(`/api/review/papers/${selectedPaper}/reject`, {method:'POST',body:JSON.stringify({reviewer:reviewer()})}); await openPaper(selectedPaper); await loadAll(); }
async function reviewClaim(id, decision) { const root = document.querySelector(`[data-claim="${CSS.escape(id)}"]`); const payload = {reviewer:reviewer(),decision}; if (decision === 'approved') Object.assign(payload,{corrected_text:root.querySelector('[name="corrected"]').value,corrected_study_design:root.querySelector('[name="design"]').value,inference:root.querySelector('[name="inference"]').value,grade:root.querySelector('[name="grade"]').value,condition_code:root.querySelector('[name="condition"]').value}); await api(`/api/review/claims/${id}`,{method:'POST',body:JSON.stringify(payload)}); await openPaper(selectedPaper); await loadAll(); }
async function createCard() { const claim_ids = [...document.querySelectorAll('[name="card-claim"]:checked')].map(x => x.value); await api('/api/review/cards',{method:'POST',body:JSON.stringify({condition_code:$('cardCondition').value,version:$('cardVersion').value,claim_ids,reviewer:reviewer(),patient_body:$('cardBody').value})}); await loadCards(); }

async function loadCards() { const cards = await api('/api/review/cards'); $('cards').innerHTML = `<h2>知识卡</h2>${cards.map(c => `<div class="claim"><strong>${esc(c.condition_code)} · ${esc(c.version)}</strong> <span class="tag">${esc(c.status)}</span><p>${esc(c.patient_visible_body)}</p><p class="muted">Claim：${(c.claim_ids || []).map(esc).join('、') || '—'}<br>论文：${(c.paper_ids || []).map(esc).join('、') || '—'}</p><div class="actions">${nextActions(c).map(a => `<button data-card="${esc(c.id)}" data-target="${esc(a)}">${esc(a)}</button>`).join('')}</div></div>`).join('') || '<p class="muted">暂无知识卡。</p>'}`; document.querySelectorAll('[data-card]').forEach(button => button.onclick = async () => { await api(`/api/review/cards/${button.dataset.card}/transition`,{method:'POST',body:JSON.stringify({reviewer:reviewer(),target:button.dataset.target})}); await loadCards(); }); }
function nextActions(card) { return ({draft:['in_review','rejected'],in_review:['approved','rejected'],approved:['published','rejected']}[card.status] || []); }

$('key').value = sessionStorage.getItem('reviewKey') || '';
$('connect').onclick = () => loadAll().catch(error => setStatus(error.message, true));
window.addEventListener('unhandledrejection', event => setStatus(event.reason?.message || '操作失败', true));
</script>
</body>
</html>
