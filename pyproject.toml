[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "genesis-evidence"
version = "0.1.0"
description = "Reviewed medical evidence and personal health report interpretation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
genesis-evidence-api = "genesis_evidence.portal.api:main"
genesis-evidence-review = "genesis_evidence.review.api:main"
genesis-evidence-worker = "genesis_evidence.literature.extraction_worker:main"
genesis-evidence-backlog = "genesis_evidence.literature.backlog:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_evidence"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
