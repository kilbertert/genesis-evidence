name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/check_scope.py
      - run: uv run python scripts/check_schema.py
      - run: uv run python scripts/check_patient_copy.py

      # The AFK sandbox's network selection: only host-loopback profiles may run
      # with `--network host`. A typo there silently changes the sandbox's reach,
      # so it gets a runnable check rather than review-only confidence.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsx .sandcastle/profile-network.check.ts
